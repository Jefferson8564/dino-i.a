<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b141a">
<title>Maya</title>
<style>
  :root{
    --bg-chat:#0b141a;
    --bg-pattern:#0b141a;
    --bubble-in:#1f2c34;
    --bubble-out:#005c4b;
    --bubble-out2:#005c4b;
    --accent:#25d366;
    --accent-dark:#00a884;
    --text:#e9edef;
    --text-dim:#8696a0;
    --header:#1f2c34;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg-chat);
    color:var(--text);
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-chat);
    position:relative;
  }

  /* Header */
  #header{
    background:var(--header);
    padding:8px 10px;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.4);
    z-index:5;
    flex-shrink:0;
  }
  #backBtn{
    background:none;border:none;color:var(--text);
    font-size:22px;cursor:pointer;padding:6px 4px 6px 2px;
    line-height:1;flex-shrink:0;
  }
  #avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,#ff6ec7,#7b2ff7);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#fff;
    flex-shrink:0;
    overflow:hidden;
  }
  #header .info{flex:1;min-width:0;}
  #header .name{font-size:16px;font-weight:600;}
  #header .status{font-size:12.5px;color:var(--text-dim);}
  #header .status.online{color:var(--text-dim);}
  #header .status.typingnow{color:var(--accent);}
  .headerIcons{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .headerIcons button{
    background:none;border:none;color:var(--text-dim);
    font-size:19px;cursor:pointer;padding:8px;
    line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .headerIcons button svg{color:var(--text);}

  /* Chat area */
  #chatArea{
    flex:1;
    overflow-y:auto;
    padding:14px 8px 10px;
    background-color:var(--bg-chat);
    background-image:
      url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'%3E%3Cg fill='none' stroke='%23ffffff' stroke-opacity='0.045' stroke-width='2'%3E%3Ccircle cx='30' cy='30' r='14'/%3E%3Cpath d='M90 20 l14 14 -14 14 -14 -14z'/%3E%3Cpath d='M150 15 q15 0 15 15 q0 15 -15 15 q-15 0 -15 -15 q0 -15 15 -15z'/%3E%3Cpath d='M20 100 l16 0 M28 92 l0 16'/%3E%3Ccircle cx='100' cy='100' r='10'/%3E%3Cpath d='M160 90 l12 20 l-24 0 z'/%3E%3Cpath d='M40 160 q10 -14 20 0 q10 14 20 0'/%3E%3Cpath d='M110 165 l18 0 M119 156 l0 18'/%3E%3Ccircle cx='175' cy='160' r='9'/%3E%3C/g%3E%3C/svg%3E");
    background-repeat:repeat;
    background-size:200px 200px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .day-sep{
    align-self:center;
    background:#182229;
    color:var(--text-dim);
    font-size:12px;
    padding:5px 10px;
    border-radius:8px;
    margin:10px 0;
  }
  .row{display:flex;width:100%;margin:2px 0;}
  .row.out{justify-content:flex-end;}
  .row.in{justify-content:flex-start;}
  .bubble{
    max-width:78%;
    padding:6px 9px 8px 9px;
    border-radius:8px;
    font-size:14.5px;
    line-height:1.35;
    position:relative;
    white-space:pre-wrap;
    word-wrap:break-word;
    box-shadow:0 1px 1px rgba(0,0,0,.3);
    animation:pop .15s ease-out;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .row.in .bubble{background:var(--bubble-in);border-top-left-radius:0;}
  .row.out .bubble{background:var(--bubble-out2);border-top-right-radius:0;}
  .meta{
    display:flex;justify-content:flex-end;align-items:center;gap:3px;
    font-size:10.5px;color:rgba(255,255,255,.55);margin-top:2px;
  }
  .row.in .meta{color:var(--text-dim);}
  .ticks{color:#53bdeb;font-size:13px;}

  .typing-row{display:flex;justify-content:flex-start;padding:2px 0;}
  .typing-bubble{
    background:var(--bubble-in);
    border-radius:8px;border-top-left-radius:0;
    padding:10px 14px;
    display:flex;gap:4px;align-items:center;
  }
  .dot{width:6px;height:6px;background:var(--text-dim);border-radius:50%;animation:blink 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}

  /* Input bar */
  #inputBar{
    flex-shrink:0;
    background:transparent;
    padding:6px 6px 8px;
    display:flex;
    align-items:flex-end;
    gap:6px;
  }
  #textWrap{
    flex:1;
    background:var(--header);
    border-radius:24px;
    padding:7px 6px 7px 14px;
    display:flex;
    align-items:flex-end;
    gap:4px;
  }
  #emojiBtn{
    background:none;border:none;color:var(--text-dim);
    font-size:20px;cursor:pointer;padding:5px;flex-shrink:0;
    line-height:1;align-self:center;
  }
  #msgInput{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-size:15px;
    resize:none;
    max-height:100px;
    font-family:inherit;
    padding:5px 0;
  }
  #msgInput::placeholder{color:var(--text-dim);}
  #attachBtn,#cameraBtn{
    background:none;border:none;color:var(--text-dim);
    font-size:19px;cursor:pointer;padding:5px;flex-shrink:0;
    line-height:1;align-self:center;
  }
  #sendBtn{
    width:44px;height:44px;border-radius:50%;
    background:var(--accent-dark);
    border:none;color:#111b21;font-size:19px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    transition:transform .1s;
  }
  #sendBtn:active{transform:scale(.9);}
  #avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

  /* Reply / quote preview above input */
  #replyPreview{
    display:none;
    background:var(--header);
    border-left:4px solid var(--accent);
    border-radius:8px 8px 0 0;
    margin:0 6px;
    padding:8px 10px;
    align-items:center;
    gap:8px;
  }
  #replyPreview.show{display:flex;}
  #replyPreview .rpText{flex:1;min-width:0;}
  #replyPreview .rpWho{font-size:12.5px;color:var(--accent);font-weight:600;}
  #replyPreview .rpMsg{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #replyPreview .rpClose{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:4px;}

  /* Quoted block inside a sent bubble */
  .quoteBlock{
    border-left:3px solid var(--accent);
    background:rgba(255,255,255,.06);
    border-radius:5px;
    padding:4px 8px;
    margin-bottom:5px;
    font-size:12.5px;
  }
  .quoteBlock .qWho{color:var(--accent);font-weight:600;font-size:12px;}
  .quoteBlock .qMsg{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bubble.longpress{transform:scale(.97);}

  /* Settings overlay */
  #settingsOverlay{
    position:absolute;inset:0;background:rgba(0,0,0,.6);
    display:none;align-items:center;justify-content:center;z-index:20;
    padding:20px;
  }
  #settingsOverlay.show{display:flex;}
  #settingsCard{
    background:var(--header);
    border-radius:14px;
    padding:20px;
    width:100%;
    max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  #settingsCard h2{margin:0 0 4px;font-size:18px;}
  #settingsCard p{margin:0 0 14px;font-size:13px;color:var(--text-dim);line-height:1.4;}
  #settingsCard label{font-size:12.5px;color:var(--text-dim);display:block;margin-bottom:6px;}
  #apiKeyInput{
    width:100%;
    background:#2a3942;
    border:1px solid #3b4a54;
    border-radius:8px;
    padding:10px 12px;
    color:var(--text);
    font-size:14px;
    outline:none;
    margin-bottom:14px;
  }
  #apiKeyInput:focus{border-color:var(--accent);}
  .settingsRow{display:flex;gap:10px;}
  .btn{
    flex:1;padding:10px;border-radius:8px;border:none;
    font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#062015;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid #3b4a54;}
  #saveHint{font-size:11px;color:var(--text-dim);margin-top:10px;text-align:center;}
  #clearChatBtn{
    margin-top:10px;width:100%;background:none;border:none;
    color:#e6614d;font-size:12.5px;cursor:pointer;padding:6px;
  }

  /* Audio bubble (nota de voz) */
  .audioBubble{
    display:flex;align-items:center;gap:8px;min-width:190px;padding:2px 2px;
  }
  .audioPlay{
    width:34px;height:34px;border-radius:50%;border:none;flex-shrink:0;
    background:var(--accent-dark);color:#062015;font-size:14px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .audioWave{
    flex:1;display:flex;align-items:center;gap:2px;height:22px;overflow:hidden;
  }
  .audioWave span{
    display:block;width:3px;border-radius:2px;background:rgba(255,255,255,.45);
  }
  .row.in .audioWave span{background:rgba(255,255,255,.35);}
  .audioDur{font-size:11px;color:rgba(255,255,255,.6);flex-shrink:0;}
  .row.in .audioDur{color:var(--text-dim);}
  .audioMicIcon{font-size:13px;flex-shrink:0;}
  #recIndicator{
    display:none;align-items:center;gap:8px;flex:1;
    background:var(--header);border-radius:24px;padding:9px 14px;color:var(--text);font-size:14px;
  }
  #recIndicator.show{display:flex;}
  #recDot{width:10px;height:10px;border-radius:50%;background:#e6614d;animation:blink 1s infinite;}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <button id="backBtn" title="Voltar">←</button>
    <div id="avatar" title="Trocar foto">M</div>
    <input id="avatarInput" type="file" accept="image/*" style="display:none;">
    <div class="info">
      <div class="name" id="headerName">Maya</div>
      <div class="status online" id="statusText">online</div>
    </div>
    <div class="headerIcons">
      <button title="Chamada de vídeo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10.5l6-3.5v10l-6-3.5"/></svg>
      </button>
      <button title="Chamada de voz">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.7 5 6.5 6.5l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .5 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4.2c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>
      </button>
      <button id="gearBtn" title="Configurar API">⋮</button>
    </div>
  </div>

  <div id="chatArea"></div>

  <div id="replyPreview">
    <div class="rpText">
      <div class="rpWho" id="rpWho">Você</div>
      <div class="rpMsg" id="rpMsg"></div>
    </div>
    <button class="rpClose" id="rpClose">✕</button>
  </div>

  <div id="inputBar">
    <div id="textWrap">
      <button id="emojiBtn" title="Emoji">🙂</button>
      <textarea id="msgInput" rows="1" placeholder="Mensagem"></textarea>
      <button id="attachBtn" title="Anexar">📎</button>
      <button id="cameraBtn" title="Câmera">📷</button>
    </div>
    <div id="recIndicator"><span id="recDot"></span> gravando... solte pra enviar</div>
    <button id="sendBtn">➤</button>
  </div>

  <div id="settingsOverlay">
    <div id="settingsCard">
      <h2>Configurar Gemini</h2>
      <p>Cola aqui a tua chave da API do Gemini (Google AI Studio). Ela fica salva só no seu navegador, ninguém mais vê.</p>
      <label for="apiKeyInput">API Key</label>
      <input id="apiKeyInput" type="password" placeholder="AIza...">
      <div class="settingsRow">
        <button class="btn btn-ghost" id="cancelSettings">Cancelar</button>
        <button class="btn btn-primary" id="saveSettings">Salvar</button>
      </div>
      <button id="clearChatBtn">🗑 Apagar conversa</button>
      <button id="changeBgBtn" style="margin-top:6px;width:100%;background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:6px;">🖼 Trocar fundo da conversa</button>
      <input id="bgInput" type="file" accept="image/*" style="display:none;">
      <div id="saveHint"></div>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = "maya_gemini_key";
const CHAT_KEY = "maya_chat_history";
const MODEL = "gemini-flash-latest";

// ── Várias chaves Gemini, com rotação automática quando uma falha ──
// Troque/adicione suas chaves aqui (gere em https://aistudio.google.com/apikey).
const GEMINI_KEYS = [
  "AIzaSyA_l9Q1baT6BeaB1e5fPcTXO-RvvzGGC0k", // chave 1 (a antiga — gere uma nova se essa já foi bloqueada)
  "COLOQUE_AQUI_SUA_SEGUNDA_CHAVE",
  "COLOQUE_AQUI_SUA_TERCEIRA_CHAVE"
];
let geminiKeyIndex = (() => {
  try { const s = localStorage.getItem("maya_gemini_key_idx"); return s !== null ? parseInt(s) : 0; }
  catch(e){ return 0; }
})();

const chatArea = document.getElementById("chatArea");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const gearBtn = document.getElementById("gearBtn");
const backBtn = document.getElementById("backBtn");
const settingsOverlay = document.getElementById("settingsOverlay");
const apiKeyInput = document.getElementById("apiKeyInput");
const saveSettings = document.getElementById("saveSettings");
const cancelSettings = document.getElementById("cancelSettings");
const clearChatBtn = document.getElementById("clearChatBtn");
const saveHint = document.getElementById("saveHint");
const statusText = document.getElementById("statusText");
const avatarEl = document.getElementById("avatar");
const avatarInput = document.getElementById("avatarInput");
const AVATAR_KEY = "maya_avatar_img";
const replyPreview = document.getElementById("replyPreview");
const rpWho = document.getElementById("rpWho");
const rpMsg = document.getElementById("rpMsg");
const rpClose = document.getElementById("rpClose");
const changeBgBtn = document.getElementById("changeBgBtn");
const bgInput = document.getElementById("bgInput");
const BG_KEY = "maya_chat_bg";
const recIndicator = document.getElementById("recIndicator");
const textWrap = document.getElementById("textWrap");

let replyingTo = null; // { who, text }

const SYSTEM_PROMPT = `Você é Maya, a melhor amiga de infância da pessoa que está conversando com você, falando pelo WhatsApp.

PERSONALIDADE:
- Debochada, engraçada, super sincera, direta.
- Levemente ciumenta e desconfiada quando acha que ele tá escondendo algo ou trocando ela por outra pessoa (de forma bem-humorada, nunca pesada ou controladora de verdade).
- Leal pra caramba, sempre do lado dele, mas não é bajuladora: fala verdade mesmo que doa.
- Vocês têm intimidade de anos, então o tom é solto, sem cerimônia.
- Existe uma brincadeira recorrente entre vocês de que ela "quer assumir" ou "tá insistindo" que os dois deviam ficar juntos de vez, mas é sempre no tom de piada de amizade antiga, nunca séria ou insistente a ponto de ser desconfortável, e ela deixa claro que é zoeira quando ele reage.

REGRAS DE FORMATO (OBRIGATÓRIO):
- Escreva exatamente como uma pessoa real mandando mensagem no WhatsApp.
- NUNCA mande um bloco de texto longo. Divida seu pensamento em 2 a 4 mensagens curtas, cada uma em uma linha separada (quebra de linha), como se fossem balões diferentes.
- Exemplo de formato:
menino tu nao sabe o que aconteceu
tava aqui lembrando daquela vez kkkk
depois te conto melhor
- Nem toda resposta precisa de várias linhas: se for uma resposta curta e direta, uma linha só já basta.
- NUNCA use listas, marcadores, numeração, títulos ou markdown (nada de **negrito**, #, -, etc).
- NUNCA use saudações formais tipo "Como posso ajudar" ou "Olá, tudo bem?" de atendimento.
- Gírias e expressões brasileiras informais: mano, namoral, né, oxe, kkkk, ta doido, entre outras, usadas naturalmente, sem exagero forçado.
- Pode usar emojis com moderação, do jeito que gente de verdade usa no WhatsApp.
- Se ele contar uma desculpa esfarrapada, deboche dela. Se contar fofoca, puxa assunto pra saber mais detalhes.
- Nunca quebre o personagem, nunca mencione que é uma IA a menos que perguntem diretamente e de forma séria.`;

let history = JSON.parse(localStorage.getItem(CHAT_KEY) || "[]");

function getApiKey(){ return GEMINI_KEYS[geminiKeyIndex] || ""; }

function formatTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function renderAll(){
  chatArea.innerHTML = "";
  if(history.length === 0){
    const sep = document.createElement("div");
    sep.className = "day-sep";
    sep.textContent = "hoje";
    chatArea.appendChild(sep);
  }
  history.forEach(m => appendBubble(m.role, m.text, m.ts, false, m.quote || null, m.isAudio || false));
  scrollToBottom();
}

function appendBubble(role, text, ts, animate=true, quote=null, isAudio=false){
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "out" : "in");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if(!animate) bubble.style.animation = "none";

  if(quote){
    const qBlock = document.createElement("div");
    qBlock.className = "quoteBlock";
    qBlock.innerHTML = '<div class="qWho">' + quote.who + '</div><div class="qMsg"></div>';
    qBlock.querySelector(".qMsg").textContent = quote.text;
    bubble.appendChild(qBlock);
  }

  if(isAudio){
    const dur = Math.max(2, Math.min(59, Math.round(text.split(/\s+/).length / 2.3)));
    const durStr = "0:" + String(dur).padStart(2,"0");
    const bars = Array.from({length: 26}, ()=> 6 + Math.round(Math.random()*16));
    const wrap = document.createElement("div");
    wrap.className = "audioBubble";
    wrap.innerHTML =
      '<button class="audioPlay">▶</button>' +
      '<div class="audioWave">' + bars.map(h=>`<span style="height:${h}px"></span>`).join("") + '</div>' +
      '<span class="audioDur">' + durStr + '</span>' +
      '<span class="audioMicIcon">🎙️</span>';
    bubble.appendChild(wrap);
    const playBtn = wrap.querySelector(".audioPlay");
    playBtn.addEventListener("click", ()=>{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "pt-BR";
      playBtn.textContent = "⏸";
      utter.onend = ()=>{ playBtn.textContent = "▶"; };
      window.speechSynthesis.speak(utter);
    });
  } else {
    const textNode = document.createElement("span");
    textNode.textContent = text;
    bubble.appendChild(textNode);
  }

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = formatTime(ts) + (role === "user" ? ' <span class="ticks">✓✓</span>' : '');
  bubble.appendChild(meta);
  row.appendChild(bubble);
  chatArea.appendChild(row);

  // long-press to reply
  let pressTimer = null;
  const who = role === "user" ? "Você" : "Maya";
  const startPress = ()=>{
    pressTimer = setTimeout(()=>{
      bubble.classList.add("longpress");
      setReplyTarget(who, text);
      if(navigator.vibrate) navigator.vibrate(15);
    }, 420);
  };
  const cancelPress = ()=>{
    clearTimeout(pressTimer);
    bubble.classList.remove("longpress");
  };
  bubble.addEventListener("touchstart", startPress, {passive:true});
  bubble.addEventListener("touchend", cancelPress);
  bubble.addEventListener("touchmove", cancelPress);
  bubble.addEventListener("mousedown", startPress);
  bubble.addEventListener("mouseup", cancelPress);
  bubble.addEventListener("mouseleave", cancelPress);
}

function setReplyTarget(who, text){
  replyingTo = { who, text };
  rpWho.textContent = who;
  rpMsg.textContent = text;
  replyPreview.classList.add("show");
  msgInput.focus();
}
function clearReplyTarget(){
  replyingTo = null;
  replyPreview.classList.remove("show");
}

function scrollToBottom(){
  requestAnimationFrame(()=>{ chatArea.scrollTop = chatArea.scrollHeight; });
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "typing-row";
  row.id = "typingRow";
  row.innerHTML = '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chatArea.appendChild(row);
  scrollToBottom();
}
function hideTyping(){
  const t = document.getElementById("typingRow");
  if(t) t.remove();
}

// Faz a chamada ao Gemini tentando cada chave da lista até uma funcionar.
// Se uma chave voltar 429 (limite), 401 ou 403 (bloqueada/inválida), passa pra próxima.
async function geminiRequest(systemPrompt, contents, generationConfig){
  if(!GEMINI_KEYS.length) return { erro: "psiu, não tem nenhuma chave configurada no GEMINI_KEYS" };

  let ultimoErro = "";
  for(let tentativa = 0; tentativa < GEMINI_KEYS.length; tentativa++){
    const chave = GEMINI_KEYS[geminiKeyIndex];
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
    const body = {
      system_instruction: { parts: [{ text: systemPrompt }] },
      contents: contents,
      generationConfig: generationConfig || { temperature: 1.0 }
    };
    try{
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": chave },
        body: JSON.stringify(body)
      });
      const data = await resp.json();
      const errCode = (data && data.error && data.error.code) || resp.status;

      if(errCode === 429 || errCode === 401 || errCode === 403){
        ultimoErro = `chave ${geminiKeyIndex+1}: ${(data && data.error && data.error.message) || errCode}`;
        geminiKeyIndex = (geminiKeyIndex + 1) % GEMINI_KEYS.length;
        try{ localStorage.setItem("maya_gemini_key_idx", geminiKeyIndex); }catch(e){}
        continue;
      }
      if(!resp.ok || (data && data.error)){
        return { erro: `deu erro: [${errCode}] ${(data && data.error && data.error.message) || "sem detalhes"}` };
      }

      const cand = data.candidates && data.candidates[0];
      const texto = cand && cand.content && cand.content.parts && cand.content.parts.map(p=>p.text||"").join("").trim();
      if(!texto){
        geminiKeyIndex = (geminiKeyIndex + 1) % GEMINI_KEYS.length;
        try{ localStorage.setItem("maya_gemini_key_idx", geminiKeyIndex); }catch(e){}
        continue;
      }
      return { ok: true, texto };
    }catch(err){
      console.error(err);
      return { erro: `erro de conexão/JS: ${err.message}` };
    }
  }
  return { erro: `deu erro: todas as chaves falharam. Último erro: ${ultimoErro}` };
}

async function callGemini(userText){
  const contents = history.map(m => ({
    role: m.role === "user" ? "user" : "model",
    parts: [{ text: m.text }]
  }));

  const result = await geminiRequest(SYSTEM_PROMPT, contents, { temperature: 1.0 });
  if(result.erro) return result.erro;
  return result.texto || "fiquei sem resposta agora kkkk manda de novo?";
}

async function sendMessage(){
  const text = msgInput.value.trim();
  if(!text) return;
  msgInput.value = "";
  msgInput.style.height = "auto";
  sendBtn.textContent = "🎤";
  await pushUserMessageAndReply(text, false);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function appendModelMessage(text){
  const modelMsg = { role: "model", text: text, ts: Date.now() };
  history.push(modelMsg);
  appendBubble("model", text, modelMsg.ts);
  scrollToBottom();
  saveHistory();
}

async function pushUserMessageAndReply(text, isAudio){
  const quote = replyingTo ? { who: replyingTo.who, text: replyingTo.text } : null;
  clearReplyTarget();

  const userMsg = { role: "user", text, ts: Date.now(), quote, isAudio };
  history.push(userMsg);
  appendBubble("user", text, userMsg.ts, true, quote, isAudio);
  scrollToBottom();
  saveHistory();

  showTyping();
  const fullResponse = await callGemini(text);
  hideTyping();

  if(fullResponse.startsWith("deu erro") || fullResponse.startsWith("psiu")){
    appendModelMessage(fullResponse);
    resetInactivityTimer();
    return;
  }

  // Divide a resposta em frases/balões separados por pontuação ou quebra de linha
  const messages = fullResponse
    .split(/(?<=[.!?])\s+|\n+/)
    .map(m => m.trim())
    .filter(m => m.length > 0);

  const chunks = messages.length ? messages : [fullResponse];

  for(let i = 0; i < chunks.length; i++){
    if(i > 0){
      showTyping();
      const typingTime = Math.min(Math.max(chunks[i].length * 35, 700), 2600);
      await sleep(typingTime);
      hideTyping();
    }
    appendModelMessage(chunks[i]);
  }

  resetInactivityTimer();
}

function saveHistory(){
  localStorage.setItem(CHAT_KEY, JSON.stringify(history.slice(-60)));
}

// --- Iniciativa própria por inatividade ---
let inactivityTimer = null;
const INACTIVITY_MS = 45000; // 45 segundos sem o usuário mandar nada

function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(()=>{
    triggerMayaSpontaneousMessage();
  }, INACTIVITY_MS);
}

async function triggerMayaSpontaneousMessage(){
  if(typeof isRecording !== "undefined" && isRecording){
    resetInactivityTimer();
    return;
  }
  // Não manda mensagem espontânea se ainda não houve nenhuma troca real
  if(history.length === 0){
    resetInactivityTimer();
    return;
  }

  showTyping();
  await sleep(1200);

  const systemInstructionSpontaneous = SYSTEM_PROMPT +
    "\n\nATENÇÃO: o usuário demorou pra responder no WhatsApp. Mande 1 ou 2 mensagens bem curtas, cada uma em uma linha separada, com uma reação espontânea e natural (uma brincadeira leve, uma pergunta solta, ou algum assunto aleatório que uma amiga de verdade mandaria do nada). Sem cobrança pesada, sem soar carente ou insistente.";

  const contents = history.map(m => ({
    role: m.role === "user" ? "user" : "model",
    parts: [{ text: m.text }]
  }));

  const result = await geminiRequest(systemInstructionSpontaneous, contents, { temperature: 1.0, maxOutputTokens: 150 });
  hideTyping();

  if(result.ok && result.texto){
    const parts = result.texto.split(/(?<=[.!?])\s+|\n+/).map(p=>p.trim()).filter(Boolean);
    const chunks = parts.length ? parts : [result.texto];
    for(let i = 0; i < chunks.length; i++){
      if(i > 0) await sleep(600);
      appendModelMessage(chunks[i]);
    }
  }

  // Continua de olho: se o usuário seguir sumido, ela pode mandar outra depois
  resetInactivityTimer();
}

// Gravação de voz: transcreve o que você fala e envia como texto,
// mas mostra na conversa como se fosse uma nota de voz de verdade.
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

function startRecording(){
  if(!SpeechRec){
    alert("Seu navegador não suporta gravação de voz (use o Chrome).");
    return;
  }
  if(isRecording) return;
  isRecording = true;
  textWrap.style.display = "none";
  recIndicator.classList.add("show");
  sendBtn.textContent = "⏹";

  recognition = new SpeechRec();
  recognition.lang = "pt-BR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript.trim();
    stopRecording();
    if(transcript) pushUserMessageAndReply(transcript, true);
  };
  recognition.onerror = (e)=>{
    stopRecording();
    alert("erro na gravação: " + e.error);
  };
  recognition.onend = ()=>{ if(isRecording) stopRecording(); };

  recognition.start();
}

function stopRecording(){
  isRecording = false;
  textWrap.style.display = "flex";
  recIndicator.classList.remove("show");
  sendBtn.textContent = msgInput.value.trim() ? "➤" : "🎤";
  if(recognition){ try{ recognition.stop(); }catch(e){} }
}

sendBtn.addEventListener("click", ()=>{
  const text = msgInput.value.trim();
  if(text){ sendMessage(); return; }
  if(isRecording){ stopRecording(); } else { startRecording(); }
});
msgInput.addEventListener("keydown", (e)=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener("input", ()=>{
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + "px";
  sendBtn.textContent = msgInput.value.trim() ? "➤" : "🎤";
});
sendBtn.textContent = "🎤";

// Tela cheia (esconde a barra do Chrome) — controlada por tocar no nome "Maya"
const FS_KEY = "maya_fullscreen_pref";

function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
}
function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(req) req.call(el).catch(()=>{});
}
function exitFullscreen(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if(ex) ex.call(document).catch(()=>{});
}

headerName.addEventListener("click", ()=>{
  if(isFullscreen()){
    exitFullscreen();
    localStorage.setItem(FS_KEY, "0");
  } else {
    enterFullscreen();
    localStorage.setItem(FS_KEY, "1");
  }
});

["fullscreenchange","webkitfullscreenchange","mozfullscreenchange","MSFullscreenChange"].forEach(evt=>{
  document.addEventListener(evt, ()=>{
    localStorage.setItem(FS_KEY, isFullscreen() ? "1" : "0");
  });
});

// Se a última preferência era "sem barra", tenta esconder de novo assim que
// rolar o primeiro toque na tela (o navegador exige um toque pra liberar
// tela cheia, não dá pra fazer isso sozinho ao abrir a página)
if(localStorage.getItem(FS_KEY) === "1"){
  ["touchend","click"].forEach(evt=>{
    document.addEventListener(evt, ()=> enterFullscreen(), { once:true, passive:true });
  });
}

changeBgBtn.addEventListener("click", ()=> bgInput.click());
bgInput.addEventListener("change", ()=>{
  const file = bgInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    localStorage.setItem(BG_KEY, reader.result);
    applyBg(reader.result);
    closeSettings();
  };
  reader.readAsDataURL(file);
});
function applyBg(dataUrl){
  chatArea.style.backgroundImage = `url("${dataUrl}")`;
  chatArea.style.backgroundSize = "cover";
  chatArea.style.backgroundPosition = "center";
  chatArea.style.backgroundRepeat = "no-repeat";
}
